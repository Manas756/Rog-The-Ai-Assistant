<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob:; style-src 'self'; img-src 'self' data:; media-src 'self' mediastream:; connect-src 'none'; worker-src 'self' blob:"
    />
    <title>ROG</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-state="IDLE">
    <canvas id="orb" aria-label="ROG assistant"></canvas>
    <div id="bubble" role="status" aria-live="polite">
      <span id="bubble-text"></span>
      <div id="chips" hidden>
        <button id="yes" type="button">Yes</button>
        <button id="no" type="button">No</button>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
